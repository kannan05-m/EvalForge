[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge"
version = "0.1.0"
description = "A local evaluation workbench for a tool-calling CRM assistant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.32"]
test = ["pytest>=8.0"]

[project.scripts]
evalforge = "evalforge.cli:main"

[tool.setuptools.packages.find]
include = ["evalforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
