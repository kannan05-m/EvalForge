name: EvalForge checks

on:
  push:
  pull_request:

jobs:
  level-one-evals:
    runs-on: ubuntu-latest
    env:
      EVALFORGE_DB: ${{ runner.temp }}/evalforge.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - run: evalforge eval
